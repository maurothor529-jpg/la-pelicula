<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas Taquilleras</title>
    <link rel="stylesheet" href="el proyecto.css">
</head>
<body>

    <div class="container">
        <div class="subtitle">Elija un capítulo</div>
        <h1 class="title">Películas taquilleras</h1>

        <div class="main-content">
            <!-- Panel Izquierdo con etiqueta IMG -->
            <div class="side-panel">
                <img src="ned kelly.jpeg" alt="Imagen Izquierda" class="panel-image">
            </div>

        
            <div class="center-panel">
                
                <div class="top-bar-image-container">
                    <img src="batalla.jpeg" alt="Fondo Diseñado Animado" class="top-bar-image">
                </div>

                
                <div class="description-box">
                    
                     <p id="dynamic-text" style="display: none;">Usted de lo que vera se trata de un chico con el prodigio de su padre, mientras que su padre se fue enlistado ala primera guerra mundial,mientras</p>
                 
<div class="movie-card" data-nombre="El Bueno, el Malo y el Feo" data-precio="15.00">
    <img src="god.jpg" alt="Capítulo 1">
    <div class="movie-price">Precio: $15.00</div>
    
</div>
<div class="movie-card" data-nombre="Star Wars" data-precio="12.50">
    <img src="star war.jpg" alt="Capítulo 2">
    <div class="movie-price">Precio: $12.50</div>
</div>
<div class="movie-card" data-nombre="Lord of War" data-precio="10.00">
    <img src="lord.jfif" alt="Capítulo 3">
    <div class="movie-price">Precio: $10.00</div>
</div>
<div class="movie-card" data-nombre="El Dorado" data-precio="8.00">
    <img src="el dorado.jfif" alt="Capítulo 4">
    <div class="movie-price">Precio: $8.00</div>
</div>
                </div>
            </div>


            <div class="side-panel">
                <img src="vaquero.jpeg" alt="Imagen Derecha" class="panel-image">
            </div>
        </div>

        <div class="button-container">
            <a href="comprar.html" class="btn" id="btn-comprar">Comprar</a>
            <a href="ver_capitulo.html" class="btn" id="btn-ver">Ver el capítulo</a>
            <a href="proximamente.html" class="btn" id="btn-proximamente">Próximamente</a>
        </div>
    </div>

    <script src="el proyecto.js"></script>
</body>
